name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Bake the tag version into Cargo.toml + the version resource so the in-app
      # update check can compare against it (dev builds stay 0.0.0 and never self-update).
      - name: Compute version from tag
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          $parts = $v -split '\.'
          (Get-Content rust/Cargo.toml) -replace '^version = "0\.0\.0"', "version = `"$v`"" | Set-Content rust/Cargo.toml
          (Get-Content rust/prayertray.rc) `
            -replace 'FILEVERSION 0,0,0,0', "FILEVERSION $($parts[0]),$($parts[1]),$($parts[2]),0" `
            -replace 'PRODUCTVERSION 0,0,0,0', "PRODUCTVERSION $($parts[0]),$($parts[1]),$($parts[2]),0" `
            -replace '"0\.0\.0"', "`"$v`"" | Set-Content rust/prayertray.rc

      - name: Test
        working-directory: rust
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Build
        working-directory: rust
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item rust/target/x86_64-pc-windows-msvc/release/prayertray.exe release/PrayerTray-win-x64.exe
          Get-ChildItem release | Select-Object Name, Length

      # Manual runs (no tag): just upload artifacts so the build is still verifiable.
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTray-exes
          path: release/*.exe

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          # Draft: assets get verified before users' update checks can see the release.
          draft: true
          generate_release_notes: true
          body: |
            ### Download

            **PrayerTray-win-x64.exe** (~3.5 MB) — native app, no runtime needed, runs on Windows 10/11.
          files: release/PrayerTray-win-x64.exe
